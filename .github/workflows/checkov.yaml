name: checkov

on:
  pull_request:
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/settings.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'

jobs:
  checkov:
    name: checkov-action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # master
        with:
          directory: ${{ github.workspace }}
          framework: all
          skip_check: CKV_AWS_116,CKV2_GHA_1
          output_format: cli,sarif
          quiet: true # display only failed checks
